<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>청수 투입량 계산기</title>
    <!-- Tailwind CSS (디자인) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 스마트폰 터치 및 수치 입력 최적화 */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 w-full h-[100dvh] flex flex-col items-center justify-between p-3 sm:p-4 font-sans select-none overflow-hidden box-border">

    <!-- 헤더 섹션 -->
    <header class="w-full max-w-sm flex items-center justify-between py-1 px-1 shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-200">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
            </div>
            <div>
                <h1 class="text-base font-extrabold text-slate-900 tracking-tight leading-none">청수 투입량 계산기</h1>
                <p class="text-[10px] font-semibold text-slate-400 mt-0.5">스마트 현장 공정 산출 시스템</p>
            </div>
        </div>
        <button onclick="handleReset()" class="flex items-center gap-1 text-xs font-bold text-slate-500 bg-white hover:bg-slate-50 active:bg-slate-200 border border-slate-200 px-2.5 py-1.5 rounded-full shadow-sm transition-all">
            <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            초기화
        </button>
    </header>

    <!-- 입력 영역 (사용자 연속 입력 흐름에 맞춘 순서) -->
    <main class="w-full max-w-sm flex-1 flex flex-col justify-center gap-2.5 py-1 overflow-hidden">
        
        <!-- 1. A (생산 전 폐수) -->
        <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-200/80 flex items-center justify-between gap-3 hover:border-blue-300 transition-colors">
            <div class="flex flex-col">
                <span class="text-[11px] font-extrabold text-blue-600 uppercase tracking-wider">기초 잔량 (A)</span>
                <span class="text-xs font-bold text-slate-700">생산 전 폐수</span>
            </div>
            <div class="relative flex-1 max-w-[150px]">
                <input type="number" id="inputA" value="70" oninput="calculate()" class="w-full bg-slate-50 text-slate-900 text-xl font-black text-center py-1.5 px-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all pr-8">
                <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400 pointer-events-none">톤</span>
            </div>
        </div>

        <!-- 2. 당일 생산량 -->
        <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-200/80 flex items-center justify-between gap-3 hover:border-blue-300 transition-colors">
            <div class="flex flex-col">
                <span class="text-[11px] font-extrabold text-emerald-600 uppercase tracking-wider">생산 실적</span>
                <span class="text-xs font-bold text-slate-700">당일 생산량</span>
            </div>
            <div class="relative flex-1 max-w-[150px]">
                <input type="number" id="inputProd" value="918" oninput="calculate()" class="w-full bg-slate-50 text-slate-900 text-xl font-black text-center py-1.5 px-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all pr-8">
                <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400 pointer-events-none">루베</span>
            </div>
        </div>

        <!-- 3. C (마감 후 폐수) -->
        <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-200/80 flex items-center justify-between gap-3 hover:border-blue-300 transition-colors">
            <div class="flex flex-col">
                <span class="text-[11px] font-extrabold text-purple-600 uppercase tracking-wider">기말 잔량 (C)</span>
                <span class="text-xs font-bold text-slate-700">마감 후 폐수</span>
            </div>
            <div class="relative flex-1 max-w-[150px]">
                <input type="number" id="inputC" value="70" oninput="calculate()" class="w-full bg-slate-50 text-slate-900 text-xl font-black text-center py-1.5 px-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white transition-all pr-8">
                <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400 pointer-events-none">톤</span>
            </div>
        </div>

        <!-- 4. B (당일 사용 폐수) - 자동계산 / 읽기전용 -->
        <div class="bg-slate-50/80 rounded-2xl p-3 border border-slate-200/90 flex items-center justify-between gap-3 opacity-95">
            <div class="flex flex-col">
                <div class="flex items-center gap-1">
                    <span class="text-[11px] font-extrabold text-slate-500 uppercase tracking-wider">소비량 (B)</span>
                    <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </div>
                <span class="text-xs font-bold text-slate-600">당일 사용 폐수 (자동)</span>
            </div>
            <div class="relative flex-1 max-w-[150px]">
                <input type="text" id="inputB" readonly value="169" class="w-full bg-slate-200/70 text-slate-700 text-xl font-black text-center py-1.5 px-3 rounded-xl border border-slate-300/60 cursor-not-allowed pr-8">
                <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-500 pointer-events-none">톤</span>
            </div>
        </div>

    </main>

    <!-- 하단 결과 및 비율 분할 영역 -->
    <footer class="w-full max-w-sm shrink-0">
        <div class="bg-gradient-to-b from-blue-600 to-indigo-700 rounded-3xl p-4 text-white shadow-xl shadow-blue-500/20 flex flex-col items-center relative overflow-hidden">
            
            <div class="flex items-center gap-1.5 mb-1 opacity-90">
                <svg class="w-4 h-4 text-yellow-300 fill-current" viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.6-6.3 4.6 2.3-7.4-6-4.6h7.6z"/></svg>
                <span class="text-xs font-extrabold tracking-wide text-blue-100 uppercase">X (투입한 청수 양)</span>
            </div>

            <!-- 메인 결과 수치 -->
            <div class="flex items-baseline justify-center gap-1.5 my-1">
                <span id="resultX" class="text-4xl sm:text-5xl font-black tracking-tight text-white drop-shadow-md text-center">169</span>
                <span class="text-lg font-bold text-blue-200">톤</span>
            </div>

            <!-- 공식 요약 -->
            <p id="formulaSummary" class="text-[11px] font-medium text-blue-200/80 mb-3">산출식: B(169) + C(70) - A(70)</p>

            <!-- 35% / 35% / 30% 비율 분할 카드 -->
            <div class="w-full bg-white/10 backdrop-blur-md rounded-2xl p-2.5 border border-white/15 flex flex-col gap-1.5">
                <div class="flex items-center justify-center gap-1 text-[10px] font-extrabold text-blue-100 uppercase tracking-wider border-b border-white/10 pb-1">
                    <span>투입 비율 분할 (35% : 35% : 30%)</span>
                </div>

                <div class="grid grid-cols-3 gap-1.5 text-center">
                    <div class="bg-black/15 rounded-xl py-1.5 px-1 border border-white/5">
                        <span class="block text-xs font-bold text-blue-200 opacity-90">1차 (35%)</span>
                        <span id="ratio1" class="block text-xl font-black text-white mt-0.5 drop-shadow-sm">59.2 <span class="text-xs font-normal opacity-80">톤</span></span>
                    </div>

                    <div class="bg-black/15 rounded-xl py-1.5 px-1 border border-white/5">
                        <span class="block text-xs font-bold text-blue-200 opacity-90">2차 (35%)</span>
                        <span id="ratio2" class="block text-xl font-black text-white mt-0.5 drop-shadow-sm">59.2 <span class="text-xs font-normal opacity-80">톤</span></span>
                    </div>

                    <div class="bg-black/15 rounded-xl py-1.5 px-1 border border-white/5">
                        <span class="block text-xs font-bold text-emerald-300 opacity-90">3차 (30%)</span>
                        <span id="ratio3" class="block text-xl font-black text-emerald-200 mt-0.5 drop-shadow-sm">50.7 <span class="text-xs font-normal opacity-80">톤</span></span>
                    </div>
                </div>
            </div>

        </div>
    </footer>

    <!-- 자바스크립트 계산 로직 -->
    <script>
        function calculate() {
            const numA = parseFloat(document.getElementById('inputA').value) || 0;
            const numProd = parseFloat(document.getElementById('inputProd').value) || 0;
            const numC = parseFloat(document.getElementById('inputC').value) || 0;

            // 1. 당일 사용 폐수 (B) 계산
            let numB = 0;
            if (numProd > 0) {
                const multiplied = Math.floor(numProd * 185);
                const strVal = multiplied.toString();
                if (strVal.length > 3) {
                    numB = parseInt(strVal.slice(0, -3), 10) || 0;
                }
            }
            document.getElementById('inputB').value = numB.toLocaleString();

            // 2. 최종 투입 청수 양 (X) = B + C - A
            const numX = numB + numC - numA;
            document.getElementById('resultX').innerText = numX.toLocaleString();
            document.getElementById('formulaSummary').innerText = `산출식: B(${numB}) + C(${numC}) - A(${numA})`;

            // 3. 비율 분할 계산 (35% : 35% : 30%)
            const r1 = (numX * 0.35).toFixed(1);
            const r2 = (numX * 0.35).toFixed(1);
            const r3 = (numX * 0.30).toFixed(1);

            document.getElementById('ratio1').innerHTML = `${r1} <span class="text-xs font-normal opacity-80">톤</span>`;
            document.getElementById('ratio2').innerHTML = `${r2} <span class="text-xs font-normal opacity-80">톤</span>`;
            document.getElementById('ratio3').innerHTML = `${r3} <span class="text-xs font-normal opacity-80">톤</span>`;
        }

        function handleReset() {
            document.getElementById('inputA').value = '0';
            document.getElementById('inputProd').value = '0';
            document.getElementById('inputC').value = '0';
            calculate();
        }

        // 초기 실행
        calculate();
    </script>
</body>
</html>
